<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Central de Projetos Contalger</title>
<style>
  :root {
    --bg: #f3f5f7;
    --navy: #0c355d;
    --navy-2: #123f6d;
    --orange: #e45b33;
    --orange-2: #ff7b4a;
    --text: #0f2237;
    --muted: #5f6f82;
    --white: #ffffff;
    --line: #d8e1ea;
    --soft: #eef3f7;
    --danger: #ca3d48;
    --success: #1d7a57;
    --shadow: 0 16px 40px rgba(12, 53, 93, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top right, rgba(228,91,51,.08), transparent 30%),
      linear-gradient(180deg, #f8fafc 0%, #f2f5f8 100%);
    min-height: 100vh;
  }

  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 20px 56px;
  }

  .hero {
    background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(244,247,250,0.98));
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 24px;
  }

  .hero-left {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .logo-box {
    background: var(--white);
    border-radius: 22px;
    padding: 10px;
    box-shadow: 0 10px 24px rgba(12, 53, 93, 0.09);
    border: 1px solid #ebeff4;
  }

  .logo-box img {
    display: block;
    width: 280px;
    max-width: 100%;
    height: auto;
  }

  .title h1 {
    margin: 0;
    font-size: 32px;
    line-height: 1.1;
    color: var(--navy);
  }

  .title p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  .hero-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  button, .btn {
    border: none;
    cursor: pointer;
    border-radius: 14px;
    padding: 12px 16px;
    font-weight: 700;
    text-decoration: none;
    font-size: 14px;
    transition: .18s ease;
  }

  button:hover, .btn:hover {
    transform: translateY(-1px);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--orange), var(--orange-2));
    color: white;
    box-shadow: 0 10px 22px rgba(228, 91, 51, 0.24);
  }

  .btn-secondary {
    background: var(--white);
    color: var(--navy);
    border: 1px solid var(--line);
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    margin-bottom: 20px;
  }

  .search {
    width: 100%;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--white);
    padding: 15px 16px;
    font-size: 15px;
    outline: none;
    color: var(--text);
    box-shadow: 0 6px 16px rgba(12, 53, 93, 0.04);
  }

  .summary {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pill {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--navy);
    padding: 12px 14px;
    border-radius: 16px;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(12, 53, 93, 0.04);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .card {
    background: linear-gradient(180deg, #ffffff, #fbfcfd);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 230px;
  }

  .card:hover {
    border-color: #bfd0e0;
  }

  .badge {
    display: inline-flex;
    width: fit-content;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(12, 53, 93, 0.08);
    color: var(--navy);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  .card h3 {
    margin: 16px 0 8px;
    font-size: 24px;
    color: var(--navy);
    line-height: 1.18;
  }

  .card p {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    flex: 1;
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .open-btn {
    background: linear-gradient(180deg, #173e63, #102d4a);
    color: white;
    box-shadow: 0 10px 24px rgba(12, 53, 93, 0.20);
  }

  .delete-btn {
    background: #fff6f6;
    color: var(--danger);
    border: 1px solid #f1cfd3;
  }

  .empty {
    display: none;
    text-align: center;
    padding: 46px 20px;
    color: var(--muted);
    background: white;
    border-radius: 24px;
    border: 1px dashed var(--line);
    margin-top: 8px;
  }

  dialog {
    width: min(560px, calc(100% - 28px));
    border: none;
    border-radius: 24px;
    padding: 0;
    overflow: hidden;
    background: var(--white);
    box-shadow: 0 40px 100px rgba(15, 28, 45, 0.35);
  }

  dialog::backdrop {
    background: rgba(9, 18, 28, 0.55);
  }

  .modal-head {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: white;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-head strong {
    font-size: 18px;
  }

  .modal-head button {
    background: rgba(255,255,255,.12);
    color: white;
    border: 1px solid rgba(255,255,255,.18);
  }

  .modal-body {
    padding: 22px;
    display: grid;
    gap: 14px;
  }

  label {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
  }

  input, textarea, select {
    width: 100%;
    margin-top: 8px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #fbfdff;
    color: var(--text);
    padding: 12px 14px;
    font: inherit;
    outline: none;
  }

  textarea {
    min-height: 92px;
    resize: vertical;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 980px) {
    .hero {
      flex-direction: column;
      align-items: flex-start;
    }
    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .hero-actions {
      justify-content: flex-start;
    }
  }

  @media (max-width: 700px) {
    .toolbar {
      grid-template-columns: 1fr;
    }
    .grid {
      grid-template-columns: 1fr;
    }
    .title h1 {
      font-size: 26px;
    }
    .hero-left {
      flex-direction: column;
      align-items: flex-start;
    }
    .logo-box img {
      width: 220px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div class="hero-left">
        <div class="logo-box">
          <img src="logo-contalger.png" alt="Logo Contalger" />
        </div>
        <div class="title">
          <h1>Central de Projetos Contalger</h1>
          <p>Acesso direto aos sistemas publicados, com opção para adicionar e excluir projetos.</p>
        </div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="openAddModal()">+ Adicionar projeto</button>
        <button class="btn btn-secondary" onclick="restoreDefaults()">Restaurar padrão</button>
      </div>
    </section>

    <section class="toolbar">
      <input id="search" class="search" type="text" placeholder="Buscar projeto..." oninput="renderProjects()" />
      <div class="summary">
        <div class="pill">Projetos: <span id="countProjects">0</span></div>
        <div class="pill">Categorias: <span id="countCategories">0</span></div>
      </div>
    </section>

    <main class="grid" id="grid"></main>
    <div class="empty" id="empty">Nenhum projeto encontrado.</div>

    <footer>
      Os projetos adicionados ou excluídos ficam salvos neste navegador.
    </footer>
  </div>

  <dialog id="projectDialog">
    <div class="modal-head">
      <strong>Adicionar projeto</strong>
      <button onclick="projectDialog.close()">Fechar</button>
    </div>
    <form class="modal-body" onsubmit="saveProject(event)">
      <label>
        Nome do projeto
        <input id="projectName" required placeholder="Ex.: Meu Sistema Fiscal" />
      </label>

      <label>
        Categoria
        <input id="projectCategory" required placeholder="Ex.: SPED / Fiscal" />
      </label>

      <label>
        Descrição
        <textarea id="projectDescription" placeholder="Descrição curta do projeto"></textarea>
      </label>

      <label>
        Link do site
        <input id="projectUrl" type="url" required placeholder="https://..." />
      </label>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="projectDialog.close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar projeto</button>
      </div>
    </form>
  </dialog>

<script>
  const baseProjects = [{"id": "reforma-tributaria", "name": "Reforma Tributária", "category": "IBS / CBS", "description": "Simulador e materiais da Reforma Tributária.", "url": "https://mauroruan2004-code.github.io/Reforma-Tribut-ria/"}, {"id": "tributacao-precificacao", "name": "Tributação e Precificação – Contalger", "category": "Contalger", "description": "Aplicação de tributação e precificação da Contalger.", "url": "https://mauroruan2004-code.github.io/tributa-o-e-precifica-o---CONTALGER/"}, {"id": "simulador-reforma-contalger", "name": "Simulador Reforma Tributária – Contalger", "category": "IBS / CBS", "description": "Simulador de créditos IBS & CBS.", "url": "https://mauroruan2004-code.github.io/Simulador-REFORMA-TRIBUT-RIA-CONTALGER/"}, {"id": "simulador-ibs-cbs", "name": "Simulador IBS/CBS", "category": "IBS / CBS", "description": "Simulador de IBS e CBS.", "url": "https://mauroruan2004-code.github.io/Simulador-IBS-CBS/"}, {"id": "complementador-e113", "name": "Complementador E113", "category": "SPED / Fiscal", "description": "Ferramenta Contalger para complemento do registro E113.", "url": "https://mauroruan2004-code.github.io/GERDADOE113/"}, {"id": "apuracao-icms-pi", "name": "Apuração ICMS PI", "category": "ICMS", "description": "Aplicação de apuração de ICMS para operações no Piauí.", "url": "https://mauroruan2004-code.github.io/APURA-O-ICMS-PI/"}, {"id": "gerador", "name": "Gerador", "category": "SPED / Fiscal", "description": "Ferramenta fiscal publicada no GitHub Pages.", "url": "https://mauroruan2004-code.github.io/GERADOR/"}, {"id": "gerador-e113", "name": "Gerador E113", "category": "SPED / Fiscal", "description": "Gerador E113 publicado no GitHub Pages.", "url": "https://mauroruan2004-code.github.io/Gerador-E113/"}];

  function getAddedProjects() {
    return JSON.parse(localStorage.getItem("contalger_added_projects") || "[]");
  }

  function setAddedProjects(list) {
    localStorage.setItem("contalger_added_projects", JSON.stringify(list));
  }

  function getDeletedProjectIds() {
    return JSON.parse(localStorage.getItem("contalger_deleted_project_ids") || "[]");
  }

  function setDeletedProjectIds(list) {
    localStorage.setItem("contalger_deleted_project_ids", JSON.stringify(list));
  }

  function getAllProjects() {
    const deletedIds = new Set(getDeletedProjectIds());
    const merged = [...baseProjects, ...getAddedProjects()];
    return merged.filter(p => !deletedIds.has(p.id));
  }

  function sanitize(text) {
    return String(text || "").replace(/[&<>"]/g, ch => {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch];
    });
  }

  function renderProjects() {
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const q = document.getElementById("search").value.trim().toLowerCase();

    const projects = getAllProjects().filter(p => {
      const hay = [p.name, p.category, p.description].join(" ").toLowerCase();
      return !q || hay.includes(q);
    });

    grid.innerHTML = projects.map(project => `
      <article class="card">
        <span class="badge">${sanitize(project.category)}</span>
        <h3>${sanitize(project.name)}</h3>
        <p>${sanitize(project.description || "Sem descrição informada.")}</p>
        <div class="actions">
          <a class="btn open-btn" href="${sanitize(project.url)}" target="_blank" rel="noopener">Abrir site</a>
          <button class="btn delete-btn" onclick="deleteProject('${project.id}')">Excluir</button>
        </div>
      </article>
    `).join("");

    empty.style.display = projects.length ? "none" : "block";

    const all = getAllProjects();
    document.getElementById("countProjects").textContent = all.length;
    document.getElementById("countCategories").textContent = new Set(all.map(p => p.category)).size;
  }

  function openAddModal() {
    document.getElementById("projectName").value = "";
    document.getElementById("projectCategory").value = "";
    document.getElementById("projectDescription").value = "";
    document.getElementById("projectUrl").value = "";
    document.getElementById("projectDialog").showModal();
  }

  function saveProject(event) {
    event.preventDefault();

    const newProject = {
      id: "custom-" + Date.now(),
      name: document.getElementById("projectName").value.trim(),
      category: document.getElementById("projectCategory").value.trim(),
      description: document.getElementById("projectDescription").value.trim(),
      url: document.getElementById("projectUrl").value.trim()
    };

    const added = getAddedProjects();
    added.unshift(newProject);
    setAddedProjects(added);

    document.getElementById("projectDialog").close();
    renderProjects();
  }

  function deleteProject(id) {
    const projects = getAllProjects();
    const project = projects.find(p => p.id === id);
    const projectName = project ? project.name : "este projeto";

    if (!confirm(`Excluir "${projectName}" da central?`)) return;

    const baseIds = new Set(baseProjects.map(p => p.id));

    if (baseIds.has(id)) {
      const deleted = getDeletedProjectIds();
      if (!deleted.includes(id)) deleted.push(id);
      setDeletedProjectIds(deleted);
    } else {
      const added = getAddedProjects().filter(p => p.id !== id);
      setAddedProjects(added);
    }

    renderProjects();
  }

  function restoreDefaults() {
    if (!confirm("Restaurar os projetos padrão e remover exclusões/adicionados salvos neste navegador?")) return;
    localStorage.removeItem("contalger_added_projects");
    localStorage.removeItem("contalger_deleted_project_ids");
    renderProjects();
  }

  renderProjects();
</script>
</body>
</html>
